name: Windows build

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build/NexaFi.exe dist/NexaFi.exe
          Get-FileHash dist/NexaFi.exe -Algorithm SHA256 |
            ForEach-Object { "NexaFi.exe  $($_.Hash.ToLower())" } |
            Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NexaFi-Windows-x64
          path: dist/
      - name: Publish permanent download
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --title "NexaFi para Windows" --notes "Versão portátil mais recente do NexaFi. Baixe o executável e confira o SHA-256 antes de executar."
          }
          gh release upload latest dist/NexaFi.exe dist/SHA256SUMS.txt --clobber
